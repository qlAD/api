name: Docker Compose CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image with Docker Compose
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
        run: |
          # 检查 Docker 版本
          docker version

          # 登录阿里云镜像仓库
          docker login --username=${DOCKER_USERNAME} --password=${DOCKER_PASSWORD} ${ALIYUN_REGISTRY}

          # 使用 Docker Compose 构建镜像
          docker compose -f docker-compose.yml build

          # 标记镜像
          docker tag restful-api-range:latest ${ALIYUN_REGISTRY}/docker-qladgk/restful-api-range:latest

          # 推送镜像到阿里云镜像仓库
          docker push ${ALIYUN_REGISTRY}/docker-qladgk/restful-api-range:latest
